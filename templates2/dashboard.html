<!DOCTYPE html>
<html>

<head>

    <title>Dashboard</title>

    <!-- jQuery -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

</head>

<body>

<h1>Socialna platforma</h1>

<!-- Ime prijavljenega uporabnika -->
<p>Prijavljen: {{ uporabnik }}</p>

<h2>Nova objava</h2>

<!-- Forma za objavo -->
<form
    action="/addPost"
    method="POST"
    enctype="multipart/form-data"
>

    <!-- Besedilo objave -->
    <textarea
        name="text"
        placeholder="Napiši objavo..."
        required
    ></textarea>

    <br><br>

    <!-- Dodajanje slike -->
    <input type="file" name="image">

    <br><br>

    <!-- Gumb -->
    <button type="submit">
        Objavi
    </button>

</form>

<hr>

<h2>Objave uporabnikov</h2>

<!-- Gre skozi vse objave -->
{% for post in posts %}

<div style="border:1px solid black; padding:10px; margin-bottom:10px;">

    <!-- Avtor -->
    <b>{{ post.author }}</b>

    <!-- Besedilo -->
    <p>{{ post.text }}</p>

    <!-- Če obstaja slika -->
    {% if post.image %}

    <img
        src="data:image/png;base64,{{ post.image }}"
        width="200"
    >

    {% endif %}

    <br><br>

    <!-- Like gumb -->
    <button
        class="likeBtn"
        data-author="{{ post.author }}"
        data-index="{{ post.index }}"
    >

        ❤️ Like ({{ post.likes }})

    </button>

    <!-- Če je uporabnik avtor -->
    {% if post.author == uporabnik %}

    <!-- Gumb za brisanje -->
    <button
        class="deleteBtn"
        data-index="{{ post.index }}"
    >
        Izbriši objavo
    </button>

    {% endif %}

</div>

{% endfor %}

<br>

<a href="/logout">Odjavi</a>

<script>

/* LIKE / UNLIKE */
$(".likeBtn").click(function() {

    let author = $(this).data("author");

    let index = $(this).data("index");

    let btn = $(this);

    $.post(

        "/likePost",

        {
            author: author,
            index: index
        },

        function(response) {

            if (response.success) {

                /* Če je like */
                if (response.liked) {

                    btn.text(
                        "💔 Unlike (" + response.likes + ")"
                    );

                }

                /* Če je unlike */
                else {

                    btn.text(
                        "❤️ Like (" + response.likes + ")"
                    );

                }
            }
        }
    );
});

/* Delete objave */
$(".deleteBtn").click(function() {
    let index = $(this).data("index");

    $.post(

        "/deletePost",

        {
            index: index
        },

        function(response) {

            if (response.success) {

                // Osveži stran
                location.reload();
            }
        }
    );
});

</script>

</body>
</html>
