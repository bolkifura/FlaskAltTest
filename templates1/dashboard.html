<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>
    <h1>Dashboard</h1>
    <h2>Pozdravljen, {{ uporabnik }}</h2>
    <h2>Moji zapiski:</h2>
    <ul>
        {% for note in notes %}
        <li id="note-{{ loop.index0 }}">
            <a href="{{ url_for('editNote', note_index=loop.index0) }}">
                {{ note.title }}
            </a>
            <button class="delete-btn" data-id="{{ loop.index0 }}">
                Izbriši zapisek
            </button>
        </li>
        {% endfor %}
    </ul>
    <hr>
    <h3>Dodaj nov zapisek:</h3>
    <form action="/saveNote" method="POST">
        <input type="text" name="title" placeholder="Naslov zapiska" required>
        <br><br>
        <textarea name="note" cols="30" rows="10" required></textarea>
        <br><br>
        <button type="submit">Shrani</button>
    </form>
    <br>
    <a href="/logout">Odjavi</a>
    <script>
        $(".delete-btn").click(function() {
            let noteIndex = $(this).data("id");
            $.ajax({
                url: "/deleteNote/" + noteIndex,
                type: "POST",
                success: function(response) {
                    if (response.success) {
                        $("#note-" + noteIndex).remove();
                    } else {
                        alert("Napaka pri brisanju.");
                    }
                },
                error: function() {
                    alert("Napaka pri AJAX klicu.");
                }
            });
        });
    </script>
</body>
</html>
