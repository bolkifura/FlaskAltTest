<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <!-- Povezava do jQuery knjižnice -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>

<body>

    <!-- Naslov strani -->
    <h1>Dashboard</h1>

    <!-- Prikaže ime prijavljenega uporabnika -->
    <h2>Pozdravljen, {{ uporabnik }}</h2>

    <!-- Naslov za zapiske -->
    <h2>Moji zapiski:</h2>

    <ul>

        <!-- Gre skozi vse zapiske -->
        {% for note in notes %}

        <!-- Vsak zapisek dobi svoj ID -->
        <li id="note-{{ loop.index0 }}">

            <!-- Link za urejanje zapiska -->
            <a href="{{ url_for('editNote', note_index=loop.index0) }}">

                <!-- Prikaže naslov zapiska -->
                {{ note.title }}

            </a>

            <!-- Gumb za brisanje -->
            <button
                class="delete-btn"
                data-id="{{ loop.index0 }}"
            >
                Izbriši zapisek
            </button>

        </li>

        {% endfor %}

    </ul>

    <hr>

    <!-- Forma za nov zapisek -->
    <h3>Dodaj nov zapisek:</h3>

    <form action="/saveNote" method="POST">

        <!-- Naslov -->
        <input
            type="text"
            name="title"
            placeholder="Naslov zapiska"
            required
        >

        <br><br>

        <!-- Besedilo -->
        <textarea
            name="note"
            cols="30"
            rows="10"
            required
        ></textarea>

        <br><br>

        <!-- Gumb za shranjevanje -->
        <button type="submit">
            Shrani
        </button>

    </form>

    <br>

    <!-- Logout -->
    <a href="/logout">Odjavi</a>

<script>

    /* Klik na gumb za brisanje */
    $(".delete-btn").click(function() {

        /* Prebere ID zapiska */
        let noteIndex = $(this).data("id");

        /* AJAX zahtevek */
        $.ajax({

            /* URL za brisanje */
            url: "/deleteNote/" + noteIndex,

            /* POST metoda */
            type: "POST",

            /* Če je uspešno */
            success: function(response) {

                if (response.success) {

                    /* Odstrani zapisek iz strani */
                    $("#note-" + noteIndex).remove();

                } else {

                    alert("Napaka pri brisanju.");

                }
            },

            /* Če pride do napake */
            error: function() {

                alert("Napaka pri AJAX klicu.");

            }
        });
    });

</script>

</body>
</html>
