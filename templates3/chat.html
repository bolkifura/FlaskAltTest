<!DOCTYPE html>
<html>

<head>

    <title>Chat App</title>

    <!-- jQuery -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

</head>

<body>

<h1>Global Chat</h1>

<!-- Trenutni uporabnik -->
<p>Prijavljen: {{ uporabnik }}</p>

<hr>

<!-- Prostor za sporočila -->
<div id="chatBox">

{% for message in messages %}

<div style="border:1px solid black; padding:10px; margin-bottom:10px;">

    <!-- Avtor -->
    <b>{{ message.author }}</b>

    <!-- Besedilo -->
    <p>{{ message.text }}</p>

    <!-- Če je uporabnik avtor -->
    {% if message.author == uporabnik %}

    <button
        class="deleteBtn"
        data-id="{{ loop.index0 }}"
    >
        Izbriši
    </button>

    {% endif %}

</div>

{% endfor %}

</div>

<hr>

<h2>Pošlji sporočilo</h2>

<!-- Input -->
<input
    type="text"
    id="messageInput"
    placeholder="Napiši sporočilo..."
>

<!-- Gumb -->
<button id="sendBtn">
    Pošlji
</button>

<br><br>

<a href="/logout">Odjavi</a>

<script>

/* Naloži sporočila */
function loadMessages() {

    $.get("/getMessages", function(data) {

        let html = "";

        /* Gre skozi vsa sporočila */
        for (let i = 0; i < data.messages.length; i++) {

            let msg = data.messages[i];

            html += `
            <div style="border:1px solid black; padding:10px; margin-bottom:10px;">

                <b>${msg.author}</b>

                <p>${msg.text}</p>
            `;

            /* Če je uporabnik avtor */
            if (msg.author === "{{ uporabnik }}") {

                html += `
                <button
                    class="dynamicDeleteBtn"
                    data-id="${i}"
                >
                    Izbriši
                </button>
                `;
            }

            html += `</div>`;
        }

        /* Prikaže HTML */
        $("#chatBox").html(html);
    });
}

/* Pošiljanje sporočila */
function sendMessage() {

    let text = $("#messageInput").val();

    $.post(

        "/sendMessage",

        {
            text: text
        },

        function(response) {

            if (response.success) {

                /* Počisti input */
                $("#messageInput").val("");

                /* Naloži nova sporočila */
                loadMessages();
            }
        }
    );
}

/* Brisanje sporočila */
function deleteMessage(index) {

    $.post(

        "/deleteMessage",

        {
            index: index
        },

        function(response) {

            if (response.success) {

                loadMessages();

            }
        }
    );
}

/* Klik na send */
$("#sendBtn").click(function() {

    sendMessage();

});

/* Klik na delete */
$(document).on("click", ".deleteBtn", function() {

    let index = $(this).data("id");

    deleteMessage(index);

});

/* Dinamični delete gumbi */
$(document).on("click", ".dynamicDeleteBtn", function() {

    let index = $(this).data("id");

    deleteMessage(index);

});

/* Vsake 3 sekunde osveži chat */
setInterval(loadMessages, 3000);

</script>

</body>
</html>
